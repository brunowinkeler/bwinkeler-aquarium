name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run validate

      - name: Verify that the committed icons are reproducible
        run: |
          npm run icons
          git diff --exit-code frontend/public/icons

      - name: Verify that the committed templates are reproducible
        run: |
          npm run templates
          git diff --exit-code frontend/public/templates

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests (PWA, Worker and /tv/ through wrangler dev)
        run: npm run test:e2e

      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
