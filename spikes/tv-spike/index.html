<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aquarium Spike</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(#0b4f6c, #06283d);
        color: #fff;
        font-family: sans-serif;
      }
      #video,
      #stage {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #video {
        object-fit: cover;
      }
      #hud {
        position: absolute;
        top: 24px;
        left: 24px;
        margin: 0;
        padding: 16px 20px;
        max-width: 1100px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 12px;
        font: 22px/1.35 monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <video id="video" src="background.mp4" autoplay loop muted></video>
    <canvas id="stage"></canvas>
    <pre id="hud"></pre>
    <script src="spike-config.js"></script>
    <script src="spike.js"></script>
  </body>
</html>
